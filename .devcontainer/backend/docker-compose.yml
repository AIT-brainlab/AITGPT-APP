services:
  backend:
    image: ${PROJECT_NAME}:latest
    container_name: ${PROJECT_NAME}-dev
    build: 
      context: .
      dockerfile: dockerfile
      args:
        - BUILD_VERSION=DEV
        - WORKDIR=/Projects/app/${PROJECT_NAME}
    # platform: linux/amd64
    ports:
      - 8000:8000
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ../../:/Projects/app:cached
      - venv:/Projects/app/${PROJECT_NAME}/.venv
      - python:/Projects/app/${PROJECT_NAME}/.python
      - uv_cache:/Projects/app/${PROJECT_NAME}/.uv_cache
      # Forwards the local Docker socket to the container.
      - /var/run/docker.sock:/var/run/docker-host.sock 

  postgres:
    image: postgres:15
    container_name: aitgpt_backend_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  venv:
  python:
  uv_cache:
  postgres_data:
