services:
  compliance:
    build:
      context: ../AITGPT-compliance-checking
      dockerfile: Dockerfile
    container_name: aitgpt_compliance
    ports:
      - "8105:8000"
    env_file:
      - ../AITGPT-compliance-checking/.env
    networks:
      - aitgpt_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  aitgpt_network:
    external: true
