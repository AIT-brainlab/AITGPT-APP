services:
  backend:
    image: ${PROJECT_NAME}:latest
    container_name: ${PROJECT_NAME}
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - 8000:8000
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}